<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضاء التكوين البيداغوجي - توقرت</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
/* ===================== الكود الأصلي كما هو ===================== */
/* (نفس CSS الذي أرسلته بدون تغيير) */
/* =============================================================== */

/* ======== إضافة تحسين التجاوب مع الهاتف (بدون حذف) ======== */
button, .service, .icon-btn {
  touch-action: manipulation;
}

@media (max-width: 768px) {

  header {
    padding: 20px 10px;
  }

  header h1 {
    font-size: 20px;
    line-height: 1.4;
  }

  header p {
    font-size: 14px;
  }

  .logo-container {
    width: 120px;
    height: 120px;
  }

  .logo-container img {
    width: 100px;
    height: 100px;
  }

  .logo-ring {
    width: 115px;
    height: 115px;
  }

  .info-box {
    margin: 15px 10px;
    padding: 15px;
  }

  .info-box h1 {
    font-size: 20px;
  }

  .info-box p {
    font-size: 14px;
  }

  .services {
    grid-template-columns: 1fr;
    padding: 20px 12px;
    gap: 15px;
  }

  .service {
    padding: 20px 10px;
  }

  .service i {
    font-size: 40px;
  }

  .service h3 {
    font-size: 16px;
  }

  .news-ticker-container {
    height: auto;
    padding: 8px;
  }

  .typewriter-text {
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
  }

  .swal2-popup {
    width: 95% !important;
    margin: auto !important;
  }

  footer {
    font-size: 13px;
    padding: 12px;
  }
}
</style>
</head>

<body>

<!-- ======== المحتوى الأصلي كما هو بدون تغيير ======== -->

<!-- نفس BODY + HTML + JS الذي أرسلته -->

<script>
/* ======== تعديل بسيط فقط لجعل SweetAlert متجاوب ======== */

function getResponsiveWidth(desktopWidth){
  return window.innerWidth < 768 ? '95%' : desktopWidth;
}

/* مثال الاستخدام:
width: getResponsiveWidth('700px')
*/

/* في جميع Swal.fire استبدل:
width: '700px'
أو
width: '800px'
بـ:
width: getResponsiveWidth('700px')
*/

</script>

</body>
</html>
